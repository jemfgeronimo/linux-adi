%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/adi,ad5940.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD5940/AD5941 high precision, impedance and electrochemical front end

maintainers:
  - John Erasmus Mari Geronimo <johnerasmusmari.geronimo@analog.com>

description: |
  The AD5940 and AD5941 are high precision, impedance and electrochemical
  analog front ends with an SPI interface. They only differ in package and
  the number of available AFE GPIOs.

  Datasheets:
    https://www.analog.com/media/en/technical-documentation/data-sheets/ad5940.pdf
    https://www.analog.com/media/en/technical-documentation/data-sheets/ad5941.pdf

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    enum:
      - adi,ad5940
      - adi,ad5941

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 16000000

  interrupts:
    maxItems: 1
    description:
      Interrupt controller output, connected to the AFE GP0 pin.

  reset-gpios:
    maxItems: 1
    description:
      Active low RESET pin.

  avdd-supply:
    description: Analog supply.

  dvdd-supply:
    description: Digital supply.

required:
  - compatible
  - reg
  - avdd-supply
  - dvdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        afe@0 {
            compatible = "adi,ad5940";
            reg = <0>;
            spi-max-frequency = <16000000>;
            interrupt-parent = <&gpio>;
            interrupts = <25 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&gpio 24 GPIO_ACTIVE_LOW>;
            avdd-supply = <&avdd_3v3>;
            dvdd-supply = <&avdd_3v3>;
        };
    };
...
